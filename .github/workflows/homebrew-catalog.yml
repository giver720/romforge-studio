name: Update homebrew catalog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate catalog
        run: python tools/homebrew_catalog.py
      - name: Commit catalog changes
        run: |
          if git diff --quiet -- public/store/catalog.json; then
            echo "Catalog unchanged"
            exit 0
          fi
          git config user.name "romforge-catalog[bot]"
          git config user.email "romforge-catalog[bot]@users.noreply.github.com"
          git add public/store/catalog.json
          git commit -m "chore: refresh homebrew catalog"
          git push
