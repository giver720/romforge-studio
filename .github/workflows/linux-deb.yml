name: Linux .deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    name: Ubuntu 22.04 amd64
    runs-on: ubuntu-22.04

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Preparar .NET para el motor FPKG de PS5
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Instalar dependencias de Tauri y de la prueba grafica
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            file \
            xvfb \
            dbus-x11 \
            python3-venv \
            unzip

      - name: Compilar y probar
        run: |
          npm ci
          rustfmt --check --edition 2021 --config skip_children=true \
            src-tauri/src/artwork.rs \
            src-tauri/src/chdman.rs \
            src-tauri/src/jobs.rs \
            src-tauri/src/lib.rs \
            src-tauri/src/ps2fpkg.rs \
            src-tauri/src/pspfpkg.rs \
            src-tauri/src/ps5.rs \
            src-tauri/src/settings.rs \
            src-tauri/src/tools.rs \
            src-tauri/src/verification.rs
          cargo test --manifest-path src-tauri/Cargo.toml
          npm run dist:linux
          src-tauri/binaries/romforge-prospero-bridge --version
          src-tauri/binaries/romforge-ampr-bridge --version
          src-tauri/binaries/romforge-psp-bridge --version

      - name: Validar e instalar el paquete
        run: |
          bundle_dir="src-tauri/target/release/bundle/deb"
          built_deb="$(find "$bundle_dir" -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$built_deb"
          version="$(dpkg-deb -f "$built_deb" Version)"
          deb="$bundle_dir/romforge-studio_${version}_amd64.deb"
          mv "$built_deb" "$deb"
          (cd "$bundle_dir" && sha256sum "$(basename "$deb")" > SHA256SUMS)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | tee "$bundle_dir/CONTENTS"
          grep -q romforge-prospero-bridge "$bundle_dir/CONTENTS"
          grep -q GPL-3.0-LibProsperoPKG.txt "$bundle_dir/CONTENTS"
          grep -q romforge-ampr-bridge "$bundle_dir/CONTENTS"
          grep -q GPL-3.0-AMPR-Emu.txt "$bundle_dir/CONTENTS"
          grep -q romforge-psp-bridge "$bundle_dir/CONTENTS"
          grep -q LGPL-3.0-LibOrbisPkg.txt "$bundle_dir/CONTENTS"
          (cd "$bundle_dir" && sha256sum --check SHA256SUMS)
          sudo apt-get install -y "./$deb"
          command -v romforge-studio
          command -v chdman
          chdman --help 2>&1 | grep -qi chdman

      - name: Probar los formatos de PS5
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/source/sce_sys"
          printf 'synthetic eboot' > "$work/source/eboot.bin"
          printf '{"titleId":"PPSA00000","titleName":"CI"}' > "$work/source/sce_sys/param.json"

          python3 -m venv "$work/venv"
          "$work/venv/bin/pip" install --disable-pip-version-check backports.strenum mkpfs==1.0.0
          site="$($work/venv/bin/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")"
          "$work/venv/bin/python" -c "from pathlib import Path; Path('$site/sitecustomize.py').write_text(\"import enum\\ntry:\\n    from enum import StrEnum\\nexcept ImportError:\\n    from backports.strenum import StrEnum\\n    enum.StrEnum = StrEnum\\n\")"
          mkpfs="$work/venv/bin/mkpfs"
          export PYTHONPATH="$site${PYTHONPATH:+:$PYTHONPATH}"
          "$mkpfs" pack exfat --cluster-size 65536 "$work/source" "$work/game.exfat"
          "$mkpfs" verify "$work/game.exfat" --source-dir "$work/source" --format exfat
          "$mkpfs" pack folder --version PS5 --inode-bits 32 --verify \
            --no-adjust-output-file-extension "$work/source" "$work/game.ffpfsc"
          "$mkpfs" unpack --deep "$work/game.ffpfsc" "$work/pfsc-out"
          diff -rq "$work/source" "$work/pfsc-out"

          curl -fL -o "$work/ufs2tool.zip" \
            https://github.com/SvenGDK/UFS2Tool/releases/download/v4.1/linux-x64-selfcontained.zip
          unzip -q "$work/ufs2tool.zip" -d "$work/ufs"
          ufs2tool="$(find "$work/ufs" -type f -name UFS2Tool -print -quit)"
          test -n "$ufs2tool"
          chmod +x "$ufs2tool"
          "$ufs2tool" newfs -D "$work/source" "$work/game.ffpkg"
          "$ufs2tool" fsck_ufs -n "$work/game.ffpkg"
          "$ufs2tool" extract "$work/game.ffpkg" "$work/ufs-out"
          diff -rq "$work/source" "$work/ufs-out"

      - name: Probar FPKG nativo de PS5
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          git clone --depth 1 --branch v2.5 \
            https://github.com/SvenGDK/LibProsperoPKG.git "$work/libprospero"
          bridge="src-tauri/binaries/romforge-prospero-bridge"
          "$bridge" convert \
            --input "$work/libprospero/src/HomebrewTest" \
            --output "$work/smoke.pkg"
          test -s "$work/smoke.pkg"
          "$bridge" validate --input "$work/smoke.pkg"

      - name: Probar AMPR/LZ4 de PS5
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/source/sce_sys" "$work/source/sce_module"
          printf 'synthetic eboot' > "$work/source/eboot.bin"
          printf '{"titleId":"PPSA00000","titleName":"CI"}' > "$work/source/sce_sys/param.json"
          dd if=/dev/zero of="$work/source/data.bin" bs=1M count=8 status=none
          printf 'protected module' > "$work/source/sce_module/lib.prx"
          bridge="src-tauri/binaries/romforge-ampr-bridge"
          "$bridge" convert --input "$work/source" --output "$work/lz4" --profile balanced
          "$bridge" verify --input "$work/lz4"
          "$bridge" unpack --input "$work/lz4" --output "$work/restored"
          # AMPR agrega su indice y fakelib al despliegue. Verificamos que cada
          # archivo original se restaure byte por byte sin rechazar esos metadatos.
          cmp "$work/source/eboot.bin" "$work/restored/eboot.bin"
          cmp "$work/source/data.bin" "$work/restored/data.bin"
          cmp "$work/source/sce_module/lib.prx" "$work/restored/sce_module/lib.prx"
          cmp "$work/source/sce_sys/param.json" "$work/restored/sce_sys/param.json"

      - name: Prueba de arranque de la interfaz
        run: |
          set +e
          xvfb-run -a timeout 12s romforge-studio >romforge-studio-smoke.log 2>&1
          status=$?
          set -e
          cat romforge-studio-smoke.log
          test "$status" -eq 124

      - name: Guardar el .deb
        uses: actions/upload-artifact@v4
        with:
          name: romforge-studio-linux-amd64-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
