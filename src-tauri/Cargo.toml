[package]
name = "chd-studio"
version = "1.8.1"
description = "Conversor de imagenes de disco a CHD con chdman"
authors = ["CHD Studio"]
edition = "2021"

[lib]
name = "chd_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dirs = "6"
which = "8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
zip = { version = "6", default-features = false, features = ["deflate", "bzip2"] }
tar = "0.4"
flate2 = "1"
base64 = "0.22"

# El actualizador solo tiene sentido en escritorio
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
